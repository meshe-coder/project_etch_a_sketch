<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f6f0e5">
    <title>Etch-a-Sketch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <header class="intro">
            <p class="eyebrow">A little creative break</p>
            <h1>Etch-a-Sketch</h1>
            <p class="subtitle">Choose a grid size, then click and drag to draw.</p>
        </header>

        <section class="sketch-board" aria-label="Drawing board">
            <div class="grid-container"></div>
        </section>

        <div class="controls">
            <button class="gridBtn" type="button">Choose grid size</button>
            <p class="hint">Tip: hold the left mouse button and move across the board.</p>
        </div>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
